name: sonar-pr-sast

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# 같은 PR의 이전 실행을 취소한다. PR 간 전역 용량 제어는 이 설정이 아닌 runner 풀로 처리한다.
concurrency:
  group: sonar-pr-sast-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_PROJECT_KEY: pr-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
  SONAR_PROJECT_NAME: ${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
  JACKSON_VERSION: '2.17.2'

jobs:
  # 별도 단일 runner를 이용해 조직 전체 SonarQube 제출 속도를 제한한다.
  # 모든 참여 저장소에 동일한 전용 runner를 허용해야 한다.
  scan:
    name: sonar-scan-submit
    if: github.event.action != 'closed'
    runs-on: [self-hosted, sonar-scan]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout feature HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java and Gradle version
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version

      - name: Ensure SonarQube PR project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            --get --data-urlencode "component=${SONAR_PROJECT_KEY}" \
            "${SONAR_HOST_URL}/api/components/show")
          if [ "$code" = "404" ]; then
            curl -fsS -X POST -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/projects/create" \
              --data-urlencode "project=${SONAR_PROJECT_KEY}" \
              --data-urlencode "name=${SONAR_PROJECT_NAME}"
          elif [ "$code" != "200" ]; then
            echo "Unexpected SonarQube HTTP $code" >&2
            exit 1
          fi
          # Optional: apply Quality Profile and Quality Gate here, BEFORE analysis.
          # Use the add_project/select APIs from the separate Quality Profile guide.

      - name: Gradle build
        shell: bash
        run: |
          set -euo pipefail

          echo "[INFO] Java environment"
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version

          echo "[INFO] Stop Gradle daemon"
          ./gradlew --stop

          echo "[INFO] Isolate Gradle caches"
          export GRADLE_USER_HOME="$(mktemp -d "${RUNNER_TEMP}/gradle.XXXXXX")"

          rm -rf .gradle build

          echo "[INFO] Check Gradle version"
          ./gradlew --version

          echo "[INFO] Validate Gradle configuration"
          ./gradlew \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --no-daemon \
            --no-configuration-cache \
            help --stacktrace

          echo "[INFO] Gradle build"
          ./gradlew \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            clean build --stacktrace --info

      - name: Generate Gradle dependency lockfile
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            -I .sonar-pr/dependency-lock.init.gradle \
            dependencies --write-locks

          if [ ! -s gradle.lockfile ]; then
            echo "::error::Failed to generate gradle.lockfile"
            exit 1
          fi

          cat gradle.lockfile

      - name: Trivy Gradle dependency scan
        shell: bash
        run: |
          set -euo pipefail

          trivy --version
          python3 --version

          bash .sonar-pr/trivy-scan.sh

          test -s .trivy-poc/trivy.json
          test -s .trivy-poc/sonar.json

      - name: Limit SonarQube CE backlog before submission
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CE_MAX_PENDING: '0'
          CE_ADMISSION_TIMEOUT_SECONDS: '900'
          CE_ADMISSION_POLL_SECONDS: '10'
        shell: bash
        run: python3 .sonar-pr/ce-admission.py

      - name: Submit SonarScanner analysis (no QG wait)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/sonar/report-task.txt

          ./gradlew --no-daemon sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_NAME}" \
            -Dsonar.projectVersion="${HEAD_SHA}" \
            -Dsonar.sources=src/main,gradle.lockfile \
            -Dsonar.externalIssuesReportPaths=.trivy-poc/sonar.json \
            -Dsonar.qualitygate.wait=false

          test -s build/sonar/report-task.txt
          grep -q '^ceTaskId=' build/sonar/report-task.txt

      - name: Transfer CE task identity to gate job
        uses: actions/upload-artifact@v4
        with:
          name: ce-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sonar/report-task.txt
          if-no-files-found: error
          retention-days: 1

  # GitHub Branch Protection: require ONLY this job as sonar-pr-sast.
  # If scan fails, this job also fails, instead of being silently skipped.
  gate:
    name: sonar-pr-sast
    needs: [scan]
    if: always() && github.event.action != 'closed'
    runs-on: [self-hosted, sonar-gate]
    timeout-minutes: 65
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout feature HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fail closed if scan did not succeed
        if: needs.scan.result != 'success'
        shell: bash
        run: |
          echo '::error::Scanner job failed, cancelled, or skipped. PR cannot merge.'
          exit 1

      - name: Download submitted CE task
        if: needs.scan.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ce-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sonar-task

      - name: Compute PR merge-base
        if: needs.scan.result == 'success'
        id: mb
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          MB=$(git merge-base "origin/${BASE_REF}" HEAD)
          echo "merge_base=${MB}" >> "$GITHUB_OUTPUT"

      - name: Prepare gate dependencies
        if: needs.scan.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          LIB="${RUNNER_TEMP}/pr-sast-gate/${JACKSON_VERSION}"
          mkdir -p "$LIB"
          for a in jackson-databind jackson-core jackson-annotations; do
            f="$LIB/$a-${JACKSON_VERSION}.jar"
            [ -s "$f" ] || curl -fsSL -o "$f" \
              "https://repo.maven.apache.org/maven2/com/fasterxml/jackson/core/$a/${JACKSON_VERSION}/$a-${JACKSON_VERSION}.jar"
          done
          echo "GATE_LIB=$LIB" >> "$GITHUB_ENV"

      - name: Diff Security Gate (no SonarQube Quality Gate enforcement)
        if: needs.scan.result == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MERGE_BASE: ${{ steps.mb.outputs.merge_base }}
          BLOCK_SEVERITIES: ${{ vars.BLOCK_SEVERITIES || 'BLOCKER,HIGH' }}
          REPORT_TASK_FILE: .sonar-task/report-task.txt
          CE_TIMEOUT_MINUTES: '45'
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: java -cp "${GATE_LIB}/*" .sonar-pr/PrSastGate.java

      - name: Publish inline SAST review comments
        if: always() && needs.scan.result == 'success' && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.sonar-pr/review-publisher.js')({ github, context, core });

      - name: PR summary comment
        if: always() && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sonar-pr-sast -->';
            let body = fs.existsSync('sast-result.md')
              ? fs.readFileSync('sast-result.md', 'utf8')
              : '## ❌ SAST 실행 실패\n\nScanner 또는 Gate 단계가 실패해 검사가 완료되지 않았습니다.';
            body = `${marker}\n${body}\n\n_run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker) && c.user?.login === 'github-actions[bot]');
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  cleanup:
    name: sonar-pr-cleanup
    if: github.event.action == 'closed'
    runs-on: [self-hosted, sonar-scan]
    timeout-minutes: 10
    steps:
      - name: Delete closed PR project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/projects/delete" \
            --data-urlencode "project=${SONAR_PROJECT_KEY}"
